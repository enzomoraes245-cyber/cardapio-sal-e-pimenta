# PostgreSQL para desenvolvimento local.
# As credenciais abaixo são apenas para uso local e podem ser sobrescritas por variáveis de ambiente.
services:
  postgres:
    image: postgres:17-alpine
    container_name: cardapio-digital-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cardapio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cardapio}
      POSTGRES_DB: ${POSTGRES_DB:-cardapio_digital}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
